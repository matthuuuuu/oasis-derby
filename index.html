<!doctype html>
<html lang="en" data-theme="sand">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oasis Derby</title>
  <meta name="description" content="A cute desert-oasis camel race you bet on with friends. 2–8 players, on phones and computers.">
  <meta name="theme-color" content="#f2b84b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Oasis Derby">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/lilita-one-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved colour theme before anything paints (no flash).
    try {
      var t = JSON.parse(localStorage.getItem('oasis-derby:prefs') || '{}').theme;
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <div id="app">
    <div class="boot">
      <img class="boot-camel" src="assets/icons/icon-192.png" alt="" width="72" height="72">
      <p>Saddling the camels…</p>
    </div>
  </div>
  <noscript>Oasis Derby needs JavaScript switched on to play.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
